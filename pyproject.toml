[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cdi-data-pipelines"
version = "0.1.0"
description = "Examples for the Complex Data Insights Data Pipelines guide"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
